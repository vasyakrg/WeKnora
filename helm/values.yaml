#
# WeKnora Helm Chart Values
#
# Best Practices References:
# - https://helm.sh/docs/chart_best_practices/values/
# - https://github.com/argoproj/argo-helm/blob/main/charts/argo-cd/values.yaml
# - https://github.com/cert-manager/cert-manager/blob/master/deploy/charts/cert-manager/values.yaml

# -- Global configuration shared across all components
# @default -- See values.yaml
global:
  # -- Storage class for all PersistentVolumeClaims
  # Set to "-" to use cluster default, or specify a storage class name
  storageClass: ""

  # -- Image pull secrets for private registries
  # @default -- []
  imagePullSecrets: []
  # - name: regcred

  # -- Maximum upload size in MB, applied to the frontend (nginx
  # client_max_body_size), the app (upload limit) and docreader (gRPC message
  # limit). Same knob as MAX_FILE_SIZE_MB in docker-compose.yml.
  maxFileSizeMB: 50

  # -- Default security context for all pods
  # Note: Official images (nginx, postgres, redis) run as root by default
  # Enable runAsNonRoot only if using non-root compatible images
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

  # -- Default security context for all containers
  # Note: readOnlyRootFilesystem disabled as images require writable filesystem
  containerSecurityContext:
    allowPrivilegeEscalation: false

# -- ServiceAccount configuration
# Ref: https://helm.sh/docs/chart_best_practices/rbac/
serviceAccount:
  # -- Create a ServiceAccount
  create: true
  # -- ServiceAccount name (auto-generated if empty)
  name: ""
  # -- Annotations to add to the ServiceAccount
  annotations: {}
  # -- Labels to add to the ServiceAccount
  labels: {}
  # -- Automount API credentials for the ServiceAccount
  automountServiceAccountToken: false

# -----------------------------------------------------------------------------
# App (Backend API Server)
# -----------------------------------------------------------------------------
app:
  # -- Enable the app component
  enabled: true

  # -- Number of replicas
  replicaCount: 1

  image:
    # -- Image repository
    repository: wechatopenai/weknora-app
    # -- Image tag (defaults to Chart.appVersion if empty)
    tag: ""
    # -- Image pull policy
    pullPolicy: IfNotPresent

  # -- Resource requests and limits
  # Ref: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

  # -- Pod security context override
  podSecurityContext: {}

  # -- Container security context override
  # Note: App requires write access for file storage
  securityContext:
    # runAsNonRoot: true  # Disabled - official images run as root
    allowPrivilegeEscalation: false

  # -- Environment variables for the app container
  # Ref: https://github.com/Tencent/WeKnora/blob/main/docker-compose.yml
  env:
    GIN_MODE: release
    # -- Retrieval driver: postgres, elasticsearch_v7, elasticsearch_v8, qdrant
    RETRIEVE_DRIVER: postgres
    LOCAL_STORAGE_BASE_DIR: /data/files
    AUTO_RECOVER_DIRTY: "true"
    STREAM_MANAGER_TYPE: redis
    CONCURRENCY_POOL_SIZE: "5"
    TZ: UTC
    # Docker sandbox talks to a local Engine API (often docker.sock = host root).
    # Leave false unless this is a private single-node install that also mounts
    # the daemon socket or points at a remote tcp:// daemon with TLS.
    WEKNORA_SANDBOX_DOCKER_ENABLED: "false"

  # -- Additional environment variables
  extraEnv: []
  # - name: OLLAMA_BASE_URL
  #   value: "http://ollama:11434"

  # -- Additional envFrom sources (ConfigMaps/Secrets mounted as env vars)
  # Handy for wiring exotic storage backends (cos/tos/obs/oss) or injecting a
  # whole ConfigMap of settings.
  extraEnvFrom: []
  # - configMapRef:
  #     name: weknora-extra-settings
  # - secretRef:
  #     name: weknora-extra-secrets

  # -- Service configuration
  service:
    type: ClusterIP
    port: 8080

  # -- Liveness probe configuration
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  # -- Readiness probe configuration
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity rules
  affinity: {}

# -----------------------------------------------------------------------------
# Frontend (Web UI)
# -----------------------------------------------------------------------------
frontend:
  # -- Enable the frontend component
  enabled: true

  # -- Number of replicas
  replicaCount: 1

  image:
    # -- Image repository
    repository: wechatopenai/weknora-ui
    # -- Image tag (defaults to Chart.appVersion if empty)
    tag: ""
    # -- Image pull policy
    pullPolicy: IfNotPresent

  # -- Resource requests and limits
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # -- Container security context
  securityContext:
    # runAsNonRoot: true  # Disabled - official images run as root
    # readOnlyRootFilesystem: true  # Disabled - images require writable fs
    allowPrivilegeEscalation: false

  # -- Service configuration
  service:
    type: ClusterIP
    port: 80

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity rules
  affinity: {}

# -----------------------------------------------------------------------------
# Docreader (Document Parser - gRPC)
# -----------------------------------------------------------------------------
docreader:
  # -- Enable the docreader component
  enabled: true

  # -- Number of replicas
  replicaCount: 1

  image:
    # -- Image repository
    repository: wechatopenai/weknora-docreader
    # -- Image tag (defaults to Chart.appVersion if empty)
    tag: ""
    # -- Image pull policy
    pullPolicy: IfNotPresent

  # -- Resource requests and limits
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # -- Container security context
  securityContext:
    # runAsNonRoot: true  # Disabled - official images run as root
    allowPrivilegeEscalation: false

  # -- Additional environment variables
  extraEnv: []

  # -- Additional envFrom sources (ConfigMaps/Secrets mounted as env vars),
  # e.g. credentials for exotic storage backends (cos/tos/obs/oss)
  extraEnvFrom: []
  # - secretRef:
  #     name: weknora-docreader-storage

  # -- Service configuration
  service:
    type: ClusterIP
    port: 50051

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity rules
  affinity: {}

# -----------------------------------------------------------------------------
# PostgreSQL (ParadeDB - Vector + BM25 Search)
# -----------------------------------------------------------------------------
postgresql:
  # -- Enable PostgreSQL
  # Set to false (or use postgresql.external.enabled=true) to skip the
  # in-cluster deployment and point the app at an external database.
  enabled: true

  # -- Use an external PostgreSQL instead of deploying ParadeDB in-cluster.
  # The app then connects to postgresql.external.host; credentials still come
  # from the main secret (secrets.dbUser/dbPassword/dbName, an existing secret
  # or External Secrets Operator).
  external:
    enabled: false
    # -- Host of the external PostgreSQL (required when external.enabled=true)
    host: ""
    # -- Port of the external PostgreSQL
    port: 5432

  image:
    # -- Image repository (ParadeDB for vector search)
    repository: paradedb/paradedb
    # -- Image tag
    tag: v0.18.9-pg17

  # -- Resource requests and limits
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # -- Container security context
  # Note: PostgreSQL requires specific user permissions
  securityContext:
    # runAsNonRoot: true  # Disabled - official images run as root
    allowPrivilegeEscalation: false

  # -- Persistence configuration
  persistence:
    # -- Enable persistence
    enabled: true
    # -- Size of the PVC
    size: 10Gi
    # -- Use existing PVC (leave empty to create new)
    existingClaim: ""

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity rules
  affinity: {}

# -----------------------------------------------------------------------------
# Redis (Stream & Task Queue)
# -----------------------------------------------------------------------------
redis:
  # -- Enable Redis
  # Set to false (or use redis.external.enabled=true) to skip the in-cluster
  # deployment and point the app at an external Redis.
  enabled: true

  # -- Use an external Redis instead of deploying it in-cluster.
  # Credentials still come from the main secret (secrets.redisPassword /
  # secrets.redisUsername, an existing secret or External Secrets Operator).
  # An empty secrets.redisPassword is allowed for a Redis without auth.
  external:
    enabled: false
    # -- Host of the external Redis (required when external.enabled=true)
    host: ""
    # -- Port of the external Redis
    port: 6379
    # -- Logical database index (REDIS_DB)
    database: 0

  image:
    # -- Image repository
    repository: redis
    # -- Image tag
    tag: 7-alpine

  # -- Resource requests and limits
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # -- Container security context
  securityContext:
    # runAsNonRoot: true  # Disabled - official images run as root
    # readOnlyRootFilesystem: true  # Disabled - images require writable fs
    allowPrivilegeEscalation: false

  # -- Persistence configuration
  persistence:
    # -- Enable persistence
    enabled: true
    # -- Size of the PVC
    size: 1Gi
    # -- Use existing PVC (leave empty to create new)
    existingClaim: ""

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity rules
  affinity: {}

# -----------------------------------------------------------------------------
# Data Files Storage
# -----------------------------------------------------------------------------
dataFiles:
  persistence:
    # -- Enable persistence for uploaded files
    enabled: true
    # -- Size of the PVC
    size: 10Gi
    # -- Use existing PVC (leave empty to create new)
    existingClaim: ""

# -----------------------------------------------------------------------------
# Ingress Configuration
# -----------------------------------------------------------------------------
ingress:
  # -- Enable ingress
  enabled: false

  # -- Ingress class name (nginx, traefik, ...)
  className: nginx

  # -- Controller preset for generated annotations: "nginx", "traefik" or
  # "none". Leave empty to auto-detect from ingress.className.
  # nginx:   proxy-body-size + proxy timeouts annotations.
  # traefik: buffering middleware annotation (maxRequestBodyBytes). Note that
  #          per-Ingress timeouts are not supported by Traefik annotations —
  #          configure them on the controller (entrypoint transport).
  preset: ""

  # -- Ingress hostname
  host: weknora.example.com

  # -- Upload body size limit in MB, applied by the controller preset
  # (nginx proxy-body-size / traefik maxRequestBodyBytes)
  maxBodySizeMB: 100

  # -- TLS configuration. TLS also turns on automatically when a
  # cert-manager certificate is issued for the ingress host
  # (see the certificate section below).
  tls:
    # -- Enable TLS
    enabled: false
    # -- TLS secret name. Empty: use the cert-manager certificate secret
    # when certificate.enabled, otherwise no secretName (controller default).
    secretName: ""

  # -- Additional annotations, merged over the preset (same key wins)
  # Ref: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/
  # Ref: https://doc.traefik.io/traefik/reference/routing-configuration/kubernetes/ingress/annotations/
  annotations: {}

# -----------------------------------------------------------------------------
# cert-manager Certificate
# -----------------------------------------------------------------------------
# Issues the TLS certificate via cert-manager instead of supplying a
# pre-created secret. Requires cert-manager with the cert-manager.io CRDs
# installed in the cluster. Ref: https://cert-manager.io/
#
# Minimal setup (certificate for the ingress host):
#   certificate:
#     enabled: true
#     issuerRef:
#       name: letsencrypt-prod
# Everything else has a sensible default.
certificate:
  # -- Render a Certificate resource
  enabled: false

  # -- DNS names (SANs) on the certificate. The first entry is the primary
  # one: it becomes commonName and decides whether the ingress TLS section is
  # wired to the issued secret automatically. Defaults to [ingress.host].
  dnsNames: []
  # - weknora.example.com
  # - www.weknora.example.com

  # -- Secret that receives the issued keypair. Only set this for a custom
  # name; by default the ingress references the generated one automatically.
  secretName: ""

  issuerRef:
    # -- Issuer name (required when enabled)
    name: letsencrypt-prod
    # -- Issuer kind: ClusterIssuer or Issuer
    kind: ClusterIssuer
    # -- Issuer API group
    group: cert-manager.io

  # -- Certificate lifetime (e.g. 2160h); empty = issuer default
  duration: ""

  # -- Renew when less than this remains (e.g. 360h); empty = issuer default
  renewBefore: ""

  # -- Private key options (passed through), e.g. {rotationPolicy: Always}
  privateKey: {}

  # -- Extra annotations for the Certificate object
  annotations: {}

# -----------------------------------------------------------------------------
# Secrets Configuration
# -----------------------------------------------------------------------------
# IMPORTANT: Do NOT use default values in production!
# Use --set or external secret management (External Secrets Operator, Vault, etc.)
#
# The secrets.* values below are only required when the chart creates the
# Secret itself (default). They are never enforced when the Secret comes from
# outside: set secrets.create=false (own ExternalSecret CR / sealed-secrets /
# manual Secret), secrets.existingSecret, or externalSecrets.enabled.
#
# Example installation:
#   helm install weknora ./helm \
#     --set secrets.dbPassword=<secure-password> \
#     --set secrets.redisPassword=<secure-password> \
#     --set secrets.jwtSecret=<secure-random-string>
#
secrets:
  # -- Create the chart-managed Secret. Set to false when the Secret is
  # provisioned outside the chart entirely (your own ExternalSecret CR,
  # sealed-secrets, manual kubectl apply, ...). The workloads then read
  # <fullname>-secrets, which you must provide yourself. externalSecrets or
  # secrets.existingSecret imply this too. When false, none of the
  # secrets.* values are required at render time.
  create: true
  # -- Database username
  dbUser: postgres
  # -- Database password. Required only for the default install (chart
  # creates the Secret and the in-cluster PostgreSQL consumes it).
  dbPassword: ""
  # -- Database name
  dbName: weknora
  # -- Redis username (OPTIONAL: for Redis 6.0+ ACL)
  redisUsername: ""
  # -- Redis password. Required for the in-cluster Redis; may stay empty for
  # an external Redis without auth.
  redisPassword: ""
  # -- JWT signing secret. Required only when the chart creates the Secret.
  jwtSecret: ""
  # -- System AES-256 key for database field encryption (must be exactly 32 bytes).
  # Encrypts: tenants.api_key, model API keys, vector store credentials,
  # web search provider keys, WeKnoraCloud.AppSecret.
  # STRONGLY RECOMMENDED to set this explicitly in production. If left empty, a
  # random 32-char value is generated on first install and reused on subsequent
  # `helm upgrade` via Secret lookup. However, if the Secret is ever
  # deleted/recreated (e.g. namespace recreated, GitOps prune, cluster rebuilt)
  # a new random value will be generated and any data encrypted with the old
  # key becomes UNRECOVERABLE (the UI will display ciphertext like "enc:v1:..."
  # instead of plaintext).
  # NOTE: TENANT_AES_KEY is deprecated since v0.4.0 — encryption now uses
  # SYSTEM_AES_KEY exclusively. The Go app no longer reads TENANT_AES_KEY and
  # it has been removed from the Secret.
  systemAesKey: ""

  # -- MinIO access key (used when storage.type=minio)
  minioAccessKey: ""
  # -- MinIO secret key (used when storage.type=minio)
  minioSecretKey: ""
  # -- S3 access key (used when storage.type=s3)
  s3AccessKey: ""
  # -- S3 secret key (used when storage.type=s3)
  s3SecretKey: ""

  # -- Use existing secret instead of creating one
  # The secret must contain the keys in use:
  #   always:        DB_USER, DB_PASSWORD, DB_NAME, REDIS_USERNAME (may be
  #                  empty), REDIS_PASSWORD (unless the external Redis has no
  #                  auth), JWT_SECRET, SYSTEM_AES_KEY
  #   neo4j.enabled: NEO4J_USERNAME, NEO4J_PASSWORD
  #   minio storage: MINIO_ACCESS_KEY_ID, MINIO_SECRET_ACCESS_KEY
  #   s3 storage:    S3_ACCESS_KEY, S3_SECRET_KEY
  existingSecret: ""

# -----------------------------------------------------------------------------
# External Secrets Operator (ESO)
# -----------------------------------------------------------------------------
# Syncs the chart secret from an external secret store (Vault, AWS/GCP/Azure
# secret managers, etc.) instead of creating a plain Kubernetes Secret.
# The rendered ExternalSecret targets the same Secret name the workloads read
# (weknora.fullname-secrets by default), so no other values need to change.
# Required remote keys mirror secrets.existingSecret above.
# Ref: https://external-secrets.io/
externalSecrets:
  # -- Enable ExternalSecret instead of the chart-managed Secret
  enabled: false

  # -- Refresh interval for syncing from the store
  refreshInterval: 1h

  # -- SecretStore reference (a cluster-scoped ClusterSecretStore also works)
  secretStore:
    # -- Name of the (Cluster)SecretStore (required when enabled)
    name: ""
    # -- Kind of the store reference: SecretStore or ClusterSecretStore
    kind: SecretStore

  # -- Target secret name (defaults to fullname-secrets)
  secretName: ""

  # -- Remote key (item/path in the external store) used by the auto-generated
  # `data` mappings. Defaults to the target secret name — the 1Password
  # pattern, where the k8s Secret mirrors an item of the same name (e.g. the
  # weknora-creds item with DB_USER, DB_PASSWORD, ... fields).
  remoteKey: ""

  # -- What happens if the target secret already exists: Owner (reconcile and
  # manage) or Merge (only sync listed keys, keep the rest). Use Merge when
  # SYSTEM_AES_KEY is managed separately, e.g. by an earlier deploy step.
  creationPolicy: Owner

  # -- What happens to the target Secret when the ExternalSecret is deleted:
  # Retain (keep it, default) or Delete.
  deletionPolicy: Retain

  # -- Extra labels/annotations for the ExternalSecret object itself
  labels: {}
  annotations: {}

  # -- Key mappings. Each entry syncs one key of the Kubernetes Secret.
  # When both `data` and `dataFrom` are empty, the chart auto-generates
  # mappings for the default key set (base keys + feature-dependent ones:
  # NEO4J_* when neo4j.enabled, MINIO_* / S3_* per storage.type) pointing at
  # `remoteKey` with property == key name. ESO rejects an ExternalSecret
  # without data/dataFrom, so at least one source is always rendered.
  data: []
  #  - secretKey: DB_PASSWORD
  #    remoteRef:
  #      key: weknora/prod        # path/key in the external store
  #      property: db-password    # field within the store entry (Vault etc.)
  #  - secretKey: JWT_SECRET
  #    remoteRef:
  #      key: weknora/prod
  #      property: jwt-secret

  # -- Alternative to data: pull whole store entries as Secret keys
  # (FindProvider / generator syntax of ESO).
  dataFrom: []
  #  - extract:
  #      key: weknora/prod

# -----------------------------------------------------------------------------
# File Storage Backend
# -----------------------------------------------------------------------------
# Non-secret storage settings shared by app and docreader. Mirrors the
# STORAGE_TYPE / MINIO_* / S3_* variables in docker-compose.yml.
# Credentials go to the main secret: secrets.minioAccessKey/minioSecretKey,
# secrets.s3AccessKey/s3SecretKey (or via External Secrets Operator).
# Any other backend (cos/tos/obs/oss/weaviate/...) can be wired with
# app.extraEnv + app.extraEnvFrom / docreader.extraEnvFrom.
storage:
  # -- Storage backend: local, minio, s3 (see docker-compose.yml for the
  # full list supported by the app). "local" uses the shared PVC.
  type: local

  # -- MinIO settings (storage.type=minio)
  minio:
    # -- MinIO endpoint, e.g. minio.example.com:9000 or in-cluster svc:9000
    endpoint: ""
    # -- Target bucket (must exist; the chart does not create buckets)
    bucket: ""
    # -- Key prefix inside the bucket
    pathPrefix: ""
    # -- Use TLS to reach MinIO
    useSSL: false

  # -- AWS S3 settings (storage.type=s3)
  s3:
    # -- Custom endpoint (leave empty for real AWS S3)
    endpoint: ""
    # -- AWS region (required for real AWS S3)
    region: ""
    bucket: ""
    # -- Key prefix inside the bucket
    pathPrefix: "weknora/"
    useSSL: true
    # -- Use path-style addressing (required for MinIO/other S3-compatible
    # endpoints exposed over a hostname/IP rather than a wildcard domain)
    forcePathStyle: false

# -----------------------------------------------------------------------------
# Optional Components (Profiles from docker-compose)
# -----------------------------------------------------------------------------

# -- Neo4j configuration (Knowledge Graph)
# Equivalent to: docker compose --profile neo4j
# Required for GraphRAG feature (sets NEO4J_ENABLE=true automatically when enabled)
neo4j:
  # -- Enable Neo4j for GraphRAG
  enabled: false

  image:
    # -- Image repository
    repository: neo4j
    # -- Image tag (matches docker-compose.yml)
    tag: "2025.10.1"

  # -- Neo4j authentication username
  username: neo4j
  # -- Neo4j authentication password (REQUIRED if enabled)
  password: ""

  # -- Resource requests and limits
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

  # -- Container security context
  securityContext:
    allowPrivilegeEscalation: false

  # -- Persistence configuration
  persistence:
    # -- Enable persistence
    enabled: true
    # -- Size of the PVC
    size: 10Gi
    # -- Use existing PVC (leave empty to create new)
    existingClaim: ""

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity rules
  affinity: {}
