{{/*
Copyright 2025 Tencent
SPDX-License-Identifier: MIT

ExternalSecret for WeKnora components.

Renders when externalSecrets.enabled=true and replaces the chart-managed
Secret (templates/secrets.yaml). The target Secret name matches what the
workloads reference (weknora.secretName), so nothing else has to change.

The remote store must expose the keys in use - see values.yaml
(secrets.existingSecret comment) for the exact list per feature set.
Ref: https://external-secrets.io/
*/}}
{{/*
ExternalSecret data: explicit `data` wins, then `dataFrom`; otherwise auto-
generate mappings for the default key set (the same keys the chart-managed
Secret would carry, incl. feature-dependent ones). Auto mode assumes the
store entry exposes one field per secret key (property = key name), which is
how the documented 1Password item is laid out. remoteKey defaults to the
target secret name (1Password pattern: the k8s Secret mirrors the item).
*/}}
{{- if .Values.externalSecrets.enabled }}
{{- $remoteKey := .Values.externalSecrets.remoteKey | default .Values.externalSecrets.secretName | default (printf "%s-secrets" (include "weknora.fullname" .)) }}
{{- $keys := list "DB_USER" "DB_PASSWORD" "DB_NAME" "REDIS_USERNAME" "REDIS_PASSWORD" "JWT_SECRET" "SYSTEM_AES_KEY" }}
{{- if .Values.neo4j.enabled }}
{{- $keys = concat $keys (list "NEO4J_USERNAME" "NEO4J_PASSWORD") }}
{{- end }}
{{- if eq .Values.storage.type "minio" }}
{{- $keys = concat $keys (list "MINIO_ACCESS_KEY_ID" "MINIO_SECRET_ACCESS_KEY") }}
{{- end }}
{{- if eq .Values.storage.type "s3" }}
{{- $keys = concat $keys (list "S3_ACCESS_KEY" "S3_SECRET_KEY") }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "weknora.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "weknora.labels" . | nindent 4 }}
    {{- with .Values.externalSecrets.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.externalSecrets.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ required "externalSecrets.secretStore.name is required when externalSecrets.enabled=true" .Values.externalSecrets.secretStore.name }}
    kind: {{ .Values.externalSecrets.secretStore.kind | default "SecretStore" }}
  target:
    name: {{ include "weknora.secretName" . }}
    creationPolicy: {{ .Values.externalSecrets.creationPolicy | default "Owner" }}
    deletionPolicy: {{ .Values.externalSecrets.deletionPolicy | default "Retain" }}
  {{- if .Values.externalSecrets.data }}
  data:
    {{- toYaml .Values.externalSecrets.data | nindent 4 }}
  {{- else if .Values.externalSecrets.dataFrom }}
  dataFrom:
    {{- toYaml .Values.externalSecrets.dataFrom | nindent 4 }}
  {{- else }}
  data:
    {{- range $keys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $remoteKey }}
        property: {{ . }}
    {{- end }}
  {{- end }}
{{- end }}
