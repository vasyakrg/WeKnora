{{/*
Copyright 2025 Tencent
SPDX-License-Identifier: MIT

Secrets for WeKnora components.

The chart-managed Secret renders only when it is actually chart-managed:
1. Default: create from secrets.* values (required checks apply here only)
2. externalSecrets.enabled=true - renders an ExternalSecret instead
3. secrets.create=false - the Secret is provisioned outside the chart
   (own ExternalSecret CR, sealed-secrets, manual apply)
4. secrets.existingSecret - reference a pre-created Secret by name
*/}}
{{- if and .Values.secrets.create (not (or .Values.secrets.existingSecret .Values.externalSecrets.enabled)) }}
{{/*
Reuse the previously generated random keys on upgrade. Without this lookup,
randAlphaNum would re-roll on every `helm upgrade` and rotate SYSTEM_AES_KEY,
making any data encrypted with the old key unreadable
(e.g. tenants.api_key would surface as enc:v1:... in the UI).
*/}}
{{- $secretName := include "weknora.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $existingSystemKey := "" }}
{{- if and $existing $existing.data }}
  {{- if index $existing.data "SYSTEM_AES_KEY" }}
    {{- $existingSystemKey = index $existing.data "SYSTEM_AES_KEY" | b64dec }}
  {{- end }}
{{- end }}
{{- $systemAesKey := .Values.secrets.systemAesKey | default $existingSystemKey | default (randAlphaNum 32) }}
{{- $inClusterRedis := and .Values.redis.enabled (not .Values.redis.external.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "weknora.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Database credentials
  DB_USER: {{ .Values.secrets.dbUser | quote }}
  DB_PASSWORD: {{ required "secrets.dbPassword is required for the default install (chart-managed Secret); provide it or switch to external secret management (secrets.create=false / secrets.existingSecret / externalSecrets)" .Values.secrets.dbPassword | quote }}
  DB_NAME: {{ .Values.secrets.dbName | quote }}
  # Redis credentials
  REDIS_USERNAME: {{ .Values.secrets.redisUsername | default "" | quote }}
  REDIS_PASSWORD: {{ if $inClusterRedis }}{{ required "secrets.redisPassword is required for the in-cluster Redis" .Values.secrets.redisPassword | quote }}{{ else }}{{ .Values.secrets.redisPassword | default "" | quote }}{{ end }}
  # Application secrets
  JWT_SECRET: {{ required "secrets.jwtSecret is required for the default install (chart-managed Secret)" .Values.secrets.jwtSecret | quote }}
  # SYSTEM_AES_KEY 加密：tenants.api_key、模型 API key、向量库凭证、web search provider key、
  # WeKnoraCloud.AppSecret 等。（TENANT_AES_KEY 已废弃：v0.4.0 起加密统一用 SYSTEM_AES_KEY，
  # Go 主应用不再读取 TENANT_AES_KEY，已从 Secret 中移除。）
  SYSTEM_AES_KEY: {{ $systemAesKey | quote }}
  {{- if .Values.neo4j.enabled }}
  # Neo4j credentials (for GraphRAG)
  NEO4J_USERNAME: {{ .Values.neo4j.username | quote }}
  NEO4J_PASSWORD: {{ required "neo4j.password is required when neo4j is enabled" .Values.neo4j.password | quote }}
  {{- end }}
  {{- if eq .Values.storage.type "minio" }}
  # MinIO credentials (storage.type=minio)
  MINIO_ACCESS_KEY_ID: {{ required "secrets.minioAccessKey is required when storage.type=minio" .Values.secrets.minioAccessKey | quote }}
  MINIO_SECRET_ACCESS_KEY: {{ required "secrets.minioSecretKey is required when storage.type=minio" .Values.secrets.minioSecretKey | quote }}
  {{- else if eq .Values.storage.type "s3" }}
  # S3 credentials (storage.type=s3)
  S3_ACCESS_KEY: {{ required "secrets.s3AccessKey is required when storage.type=s3" .Values.secrets.s3AccessKey | quote }}
  S3_SECRET_KEY: {{ required "secrets.s3SecretKey is required when storage.type=s3" .Values.secrets.s3SecretKey | quote }}
  {{- end }}
{{- end }}
