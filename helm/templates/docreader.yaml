{{- if .Values.docreader.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "weknora.fullname" . }}-docreader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "weknora.componentLabels" (dict "component" "docreader" "context" .) | nindent 4 }}
spec:
  replicas: {{ .Values.docreader.replicaCount }}
  selector:
    matchLabels:
      {{- include "weknora.componentSelectorLabels" (dict "component" "docreader" "context" .) | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "weknora.componentSelectorLabels" (dict "component" "docreader" "context" .) | nindent 8 }}
    spec:
      {{- include "weknora.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "weknora.serviceAccountName" . }}
      {{- with .Values.global.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: docreader
          image: {{ include "weknora.docreader.image" . }}
          imagePullPolicy: {{ .Values.docreader.image.pullPolicy }}
          {{- with .Values.docreader.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 50051
              name: grpc
              protocol: TCP
          env:
            - name: STORAGE_TYPE
              value: {{ .Values.storage.type | quote }}
            - name: MAX_FILE_SIZE_MB
              value: {{ .Values.global.maxFileSizeMB | quote }}
            {{- if eq .Values.storage.type "minio" }}
            # MinIO object storage (credentials from the chart secret / ESO)
            - name: MINIO_ENDPOINT
              value: {{ required "storage.minio.endpoint is required when storage.type=minio" .Values.storage.minio.endpoint | quote }}
            - name: MINIO_BUCKET_NAME
              value: {{ required "storage.minio.bucket is required when storage.type=minio" .Values.storage.minio.bucket | quote }}
            - name: MINIO_PATH_PREFIX
              value: {{ .Values.storage.minio.pathPrefix | default "" | quote }}
            - name: MINIO_USE_SSL
              value: {{ .Values.storage.minio.useSSL | quote }}
            - name: MINIO_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "weknora.secretName" . }}
                  key: MINIO_ACCESS_KEY_ID
                  optional: true
            - name: MINIO_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "weknora.secretName" . }}
                  key: MINIO_SECRET_ACCESS_KEY
                  optional: true
            {{- else if eq .Values.storage.type "s3" }}
            # AWS S3 object storage (credentials from the chart secret / ESO)
            - name: S3_ENDPOINT
              value: {{ .Values.storage.s3.endpoint | default "" | quote }}
            - name: S3_REGION
              value: {{ .Values.storage.s3.region | default "" | quote }}
            - name: S3_BUCKET_NAME
              value: {{ required "storage.s3.bucket is required when storage.type=s3" .Values.storage.s3.bucket | quote }}
            - name: S3_PATH_PREFIX
              value: {{ .Values.storage.s3.pathPrefix | default "" | quote }}
            - name: S3_USE_SSL
              value: {{ .Values.storage.s3.useSSL | quote }}
            - name: S3_FORCE_PATH_STYLE
              value: {{ .Values.storage.s3.forcePathStyle | quote }}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "weknora.secretName" . }}
                  key: S3_ACCESS_KEY
                  optional: true
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "weknora.secretName" . }}
                  key: S3_SECRET_KEY
                  optional: true
            {{- end }}
          {{- with .Values.docreader.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.docreader.resources | nindent 12 }}
          # gRPC health check using grpc_health_probe
          livenessProbe:
            exec:
              command:
                - grpc_health_probe
                - -addr=localhost:50051
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - grpc_health_probe
                - -addr=localhost:50051
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      {{- with .Values.docreader.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.docreader.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.docreader.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  # Service name must be "docreader" - app references this
  name: docreader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "weknora.componentLabels" (dict "component" "docreader" "context" .) | nindent 4 }}
spec:
  type: {{ .Values.docreader.service.type }}
  selector:
    {{- include "weknora.componentSelectorLabels" (dict "component" "docreader" "context" .) | nindent 4 }}
  ports:
    - name: grpc
      port: {{ .Values.docreader.service.port }}
      targetPort: grpc
      protocol: TCP
{{- end }}
