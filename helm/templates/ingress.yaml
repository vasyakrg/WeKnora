{{/*
Copyright 2025 Tencent
SPDX-License-Identifier: MIT

Ingress resource for WeKnora.
Routes /api to backend, / to frontend.

Annotations come from the controller preset (weknora.ingress.annotations
helper) merged with ingress.annotations user overrides. Works with any
ingress controller; preset only adds sensible defaults for nginx and traefik.
*/}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "weknora.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "weknora.componentLabels" (dict "component" "ingress" "context" .) | nindent 4 }}
  {{- with include "weknora.ingress.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if eq (include "weknora.ingress.tlsEnabled" .) "true" }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      {{- with include "weknora.ingress.tlsSecretName" . }}
      secretName: {{ . }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # API routes - must come first (more specific path)
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  name: http
          # Frontend routes - catch-all
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
{{- end }}
